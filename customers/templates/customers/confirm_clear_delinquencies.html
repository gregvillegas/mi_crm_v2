{% extends 'base.html' %}
{% block title %}Clear Delinquency Records{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-exclamation-triangle text-danger"></i> Clear Delinquency Records</h2>
    <div>
        <a href="{% url 'delinquent_list' %}" class="btn btn-outline-secondary">Back</a>
    </div>
    </div>
<div class="alert alert-warning">
    <strong>Warning:</strong> This will permanently delete all delinquency records. This action cannot be undone.
  </div>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i> Clear All Records</button>
  <a href="{% url 'delinquent_list' %}" class="btn btn-secondary ms-2">Cancel</a>
</form>
{% endblock %}
