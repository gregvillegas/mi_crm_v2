# ==============================================================================
# Apache Configuration for Django CRM Project
# ==============================================================================
# Installation instructions:
#   1. Copy this file to: /etc/apache2/sites-available/mi_crm.conf
#   2. Enable the site: sudo a2ensite mi_crm
#   3. Enable required modules: sudo a2enmod wsgi rewrite headers ssl
#   4. Test config: sudo apache2ctl configtest
#   5. Reload Apache: sudo systemctl reload apache2
# ==============================================================================

# ------------------------------------------------------------------------------
# HTTP -> HTTPS Redirect (Port 80)
# ------------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName crm.microimageph.com
    ServerAdmin admin@microimageph.com

    # Redirect all HTTP traffic to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/mi_crm_error.log
    CustomLog ${APACHE_LOG_DIR}/mi_crm_access.log combined
</VirtualHost>

# ------------------------------------------------------------------------------
# HTTPS (Port 443) — Production Configuration
# ------------------------------------------------------------------------------
<VirtualHost *:443>
    ServerName crm.microimageph.com
    ServerAdmin admin@microimageph.com

    # Project Root
    DocumentRoot /var/www/mi_crm

    # SSL Configuration (replace with your actual certificate paths)
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/crm.microimageph.com.crt
    SSLCertificateKeyFile /etc/ssl/private/crm.microimageph.com.key
    SSLCertificateChainFile /etc/ssl/certs/ca-bundle.crt

    # Modern SSL Configuration (strong security)
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES
    SSLHonorCipherOrder on

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/mi_crm_error.log
    CustomLog ${APACHE_LOG_DIR}/mi_crm_access.log combined

    # Static Files (CSS, JS, images collected by collectstatic)
    Alias /static /var/www/mi_crm/staticfiles
    <Directory /var/www/mi_crm/staticfiles>
        Require all granted
        # Enable caching for performance
        <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresDefault "access plus 1 year"
        </IfModule>
    </Directory>

    # Media Files (user uploads)
    Alias /media /var/www/mi_crm/media
    <Directory /var/www/mi_crm/media>
        Require all granted
        # Prevent execution of scripts in media directory
        <FilesMatch "\.(php|py|pl|sh|cgi)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # WSGI Application
    <Directory /var/www/mi_crm/crm_project>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    # WSGI Daemon Process Configuration
    WSGIDaemonProcess mi_crm \
        python-path=/var/www/mi_crm \
        python-home=/var/www/mi_crm/venv \
        processes=4 \
        threads=2 \
        display-name=%{GROUP} \
        lang='en_US.UTF-8' \
        locale='en_US.UTF-8'
    
    WSGIProcessGroup mi_crm
    WSGIScriptAlias / /var/www/mi_crm/crm_project/wsgi.py

    # Pass environment variables to WSGI process
    # IMPORTANT: Store sensitive values in /var/www/mi_crm/.env
    # Django will read them via python-decouple
    WSGIPassAuthorization On

    # Security Headers
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    </IfModule>

    # Limit request body size (prevent large uploads DoS)
    LimitRequestBody 52428800

    # Directory listing disabled
    <Directory /var/www/mi_crm>
        Options -Indexes
    </Directory>
</VirtualHost>

# ==============================================================================
# Notes:
# ------------------------------------------------------------------------------
# 1. SSL Certificates: Replace the SSLCertificate* paths with your actual
#    certificate files. You can get free certificates from Let's Encrypt:
#    sudo apt install certbot python3-certbot-apache
#    sudo certbot --apache -d crm.microimageph.com
#
# 2. Environment Variables: All secrets should be in /var/www/mi_crm/.env
#    Do NOT use SetEnv directives for secrets in this file.
#
# 3. File Permissions:
#    sudo chown -R www-data:www-data /var/www/mi_crm/media
#    sudo chown -R www-data:www-data /var/www/mi_crm/staticfiles
#    sudo chmod 600 /var/www/mi_crm/.env
#
# 4. For development/testing without SSL, you can temporarily use the HTTP
#    VirtualHost and comment out the HTTPS redirect.
# ==============================================================================
