<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interested - {{ campaign.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .form-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            margin: 20px;
            overflow: hidden;
        }
        .form-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        .form-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .form-header p {
            opacity: 0.9;
            margin: 0;
        }
        .form-body {
            padding: 40px 30px;
        }
        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        .form-control, .form-control:focus {
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            padding: 12px 16px;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            color: white;
            padding: 14px 32px;
            font-weight: 600;
            font-size: 16px;
            width: 100%;
            transition: transform 0.2s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        .required-mark {
            color: #dc3545;
        }
        .campaign-info {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
            border-left: 4px solid #667eea;
        }
        .campaign-info strong {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="form-header">
            <i class="fas fa-envelope-open-text fa-3x mb-3"></i>
            <h1>We'd Love to Hear From You!</h1>
            <p>Thank you for your interest. Please share your details below.</p>
        </div>
        
        <div class="form-body">
            <div class="campaign-info">
                <small class="text-muted">Campaign:</small><br>
                <strong>{{ campaign.subject }}</strong>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post" action="{% url 'mass_mailing:submit_inquiry' recipient.id %}">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="name" class="form-label">
                        Full Name <span class="required-mark">*</span>
                    </label>
                    <input 
                        type="text" 
                        class="form-control" 
                        id="name" 
                        name="name" 
                        placeholder="John Doe"
                        value="{{ form_data.name|default:recipient.display_contact_name|default:'' }}"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="company" class="form-label">Company Name</label>
                    <input 
                        type="text" 
                        class="form-control" 
                        id="company" 
                        name="company" 
                        placeholder="Your Company Inc."
                        value="{{ form_data.company|default:recipient.display_company_name|default:'' }}"
                    >
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">
                        Email Address <span class="required-mark">*</span>
                    </label>
                    <input 
                        type="email" 
                        class="form-control" 
                        id="email" 
                        name="email" 
                        placeholder="john.doe@company.com"
                        value="{{ form_data.email|default:recipient.email }}"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input 
                        type="tel" 
                        class="form-control" 
                        id="phone" 
                        name="phone" 
                        placeholder="+63 912 345 6789"
                        value="{{ form_data.phone|default:'' }}"
                    >
                </div>

                <div class="mb-4">
                    <label for="message" class="form-label">
                        Your Message <span class="required-mark">*</span>
                    </label>
                    <textarea 
                        class="form-control" 
                        id="message" 
                        name="message" 
                        rows="4"
                        placeholder="I'm interested in learning more about..."
                        required
                    >{{ form_data.message|default:'' }}</textarea>
                </div>

                <button type="submit" class="btn btn-submit">
                    <i class="fas fa-paper-plane me-2"></i>
                    Send Inquiry
                </button>

                <div class="text-center mt-3">
                    <small class="text-muted">
                        Your inquiry will be sent directly to our sales team.
                    </small>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
