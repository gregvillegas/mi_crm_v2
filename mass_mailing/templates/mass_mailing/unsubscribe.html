<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsubscribe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .unsubscribe-card {
            max-width: 500px;
            margin: 100px auto;
            border-top: 4px solid #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card shadow-sm border-0 unsubscribe-card">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="fas fa-envelope-open-text fa-3x text-muted mb-3"></i>
                    <h4>Unsubscribe from Marketing Emails</h4>
                    <p class="text-muted">We're sorry to see you go.</p>
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label text-muted small text-uppercase fw-bold">Your Email</label>
                        {{ form.email }}
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small text-uppercase fw-bold">Reason (Optional)</label>
                        {{ form.reason }}
                    </div>
                    
                    <button type="submit" class="btn btn-danger w-100 py-2 fw-bold">
                        Confirm Unsubscribe
                    </button>
                </form>
                
                <div class="text-center mt-4 pt-3 border-top">
                    <small class="text-muted">Micro Image International Corp.<br>Committed to Data Privacy Act of 2012</small>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
