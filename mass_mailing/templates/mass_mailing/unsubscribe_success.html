<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsubscribed Successfully</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .success-card {
            max-width: 500px;
            margin: 100px auto;
            border-top: 4px solid #198754;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card shadow-sm border-0 success-card">
            <div class="card-body p-5 text-center">
                <div class="mb-4">
                    <div class="rounded-circle bg-success bg-opacity-10 d-inline-flex align-items-center justify-content-center" style="width: 80px; height: 80px;">
                        <i class="fas fa-check text-success fa-3x"></i>
                    </div>
                </div>
                
                <h4 class="mb-3">Successfully Unsubscribed</h4>
                <p class="text-muted mb-0">
                    <strong>{{ email }}</strong> has been removed from our marketing mailing list.
                </p>
                <p class="text-muted mt-2 small">
                    You will no longer receive promotional emails from us. Please note that you may still receive important transactional or account-related emails.
                </p>
                
                <div class="mt-5 pt-3 border-top">
                    <small class="text-muted">Micro Image International Corp.</small>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
