<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Manrope', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen pb-20">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#f4faff] dark:bg-slate-950 border-b border-transparent">
<div class="flex justify-between items-center px-4 h-16 w-full max-w-7xl mx-auto">
<div class="flex items-center gap-4">
<button class="hover:bg-[#e6f6ff] dark:hover:bg-slate-800 transition-colors p-2 rounded-full active:scale-95 duration-150">
<span class="material-symbols-outlined text-slate-600 dark:text-slate-400">close</span>
</button>
<h1 class="font-['Manrope'] font-bold text-lg text-on-surface">Create Activity</h1>
</div>
<button class="bg-[#b22222] text-white px-6 py-2 rounded-xl font-bold font-['Manrope'] text-sm active:scale-95 duration-150 transition-all shadow-md">
                Save
            </button>
</div>
</header>
<main class="pt-20 px-4 max-w-4xl mx-auto">
<!-- Form Container -->
<div class="space-y-6">
<!-- Bento Layout Section 1: Identity & Context -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
<!-- Activity Title -->
<div class="md:col-span-2 bg-surface-container-lowest p-6 rounded-xl shadow-sm border border-outline-variant/15">
<label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-2">Activity Title</label>
<input class="w-full bg-surface-container-high border-none border-b-2 border-primary focus:ring-0 rounded-t-lg px-4 py-3 text-on-surface placeholder-on-surface-variant/50" placeholder="e.g. Q4 Strategy Review" type="text"/>
</div>
<!-- Activity Type Selection -->
<div class="bg-surface-container-low p-6 rounded-xl border border-outline-variant/15">
<label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-4">Activity Type</label>
<div class="grid grid-cols-2 gap-2">
<button class="flex flex-col items-center justify-center p-3 bg-surface-container-highest rounded-lg text-primary border border-primary/20 transition-all active:scale-95">
<span class="material-symbols-outlined mb-1">meeting_room</span>
<span class="text-[10px] font-bold">Meeting</span>
</button>
<button class="flex flex-col items-center justify-center p-3 bg-white rounded-lg text-on-surface-variant border border-transparent hover:bg-surface-container transition-all active:scale-95">
<span class="material-symbols-outlined mb-1">call</span>
<span class="text-[10px] font-bold">Call</span>
</button>
<button class="flex flex-col items-center justify-center p-3 bg-white rounded-lg text-on-surface-variant border border-transparent hover:bg-surface-container transition-all active:scale-95">
<span class="material-symbols-outlined mb-1">task_alt</span>
<span class="text-[10px] font-bold">Task</span>
</button>
<button class="flex flex-col items-center justify-center p-3 bg-white rounded-lg text-on-surface-variant border border-transparent hover:bg-surface-container transition-all active:scale-95">
<span class="material-symbols-outlined mb-1">mail</span>
<span class="text-[10px] font-bold">Email</span>
</button>
</div>
</div>
</div>
<!-- Bento Layout Section 2: Scheduling & Entity -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<!-- Date & Time Group -->
<div class="bg-surface-container-lowest p-6 rounded-xl shadow-sm border border-outline-variant/15 flex flex-col justify-between">
<div class="space-y-4">
<div class="relative">
<label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-2">Schedule Date</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-primary text-xl">calendar_today</span>
<input class="w-full bg-surface-container-low pl-11 pr-4 py-3 border-none rounded-lg text-sm font-medium focus:ring-0" type="text" value="Oct 24, 2023"/>
</div>
</div>
<div class="relative">
<label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-2">Start Time</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-primary text-xl">schedule</span>
<input class="w-full bg-surface-container-low pl-11 pr-4 py-3 border-none rounded-lg text-sm font-medium focus:ring-0" type="text" value="10:30 AM"/>
</div>
</div>
</div>
</div>
<!-- Customer Selection -->
<div class="bg-surface-container-highest/50 p-6 rounded-xl border border-primary/5 flex flex-col">
<label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-2">Customer / Account</label>
<div class="relative flex-grow flex flex-col justify-center">
<div class="bg-white p-4 rounded-xl shadow-sm border border-outline-variant/10 group cursor-pointer hover:border-primary/30 transition-all">
<div class="flex items-center gap-4">
<div class="w-10 h-10 bg-primary-container rounded-lg flex items-center justify-center text-white font-bold">G</div>
<div class="flex-grow">
<p class="text-sm font-bold text-on-surface">Global Logistics Partners</p>
<p class="text-[11px] text-on-surface-variant">Key Account • Chicago, IL</p>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">search</span>
</div>
</div>
<div class="mt-4 p-3 bg-surface rounded-lg border-l-4 border-primary">
<p class="text-[11px] font-medium text-primary uppercase">Recent Interaction</p>
<p class="text-xs text-on-surface mt-1">Proposal sent 2 days ago via Email</p>
</div>
</div>
</div>
</div>
<!-- Notes Section -->
<div class="bg-surface-container-lowest p-6 rounded-xl shadow-sm border border-outline-variant/15">
<div class="flex justify-between items-center mb-4">
<label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wider">Internal Notes</label>
<button class="text-xs text-primary font-bold hover:underline">Add Template</button>
</div>
<textarea class="w-full bg-surface border-2 border-outline-variant/20 focus:border-primary focus:ring-0 rounded-xl px-4 py-3 text-sm text-on-surface leading-relaxed transition-all placeholder-on-surface-variant/40" placeholder="Document meeting outcomes, specific requests, or next steps..." rows="6"></textarea>
</div>
<!-- Completion Toggle & Quick Meta -->
<div class="bg-surface-container-low p-6 rounded-xl border border-outline-variant/15 flex flex-col md:flex-row md:items-center justify-between gap-6">
<label class="flex items-center gap-4 cursor-pointer group">
<div class="relative w-6 h-6 flex items-center justify-center">
<input class="peer appearance-none w-6 h-6 border-2 border-outline rounded-md checked:bg-primary checked:border-primary transition-all" type="checkbox"/>
<span class="material-symbols-outlined text-white text-lg scale-0 peer-checked:scale-100 transition-transform absolute pointer-events-none">check</span>
</div>
<div>
<span class="block text-sm font-bold text-on-surface group-hover:text-primary transition-colors">Mark as Complete</span>
<span class="block text-[11px] text-on-surface-variant">Log this activity as finished immediately upon save</span>
</div>
</label>
<div class="flex items-center gap-3 bg-white p-3 rounded-lg border border-outline-variant/10">
<div class="w-8 h-8 rounded-full overflow-hidden">
<img class="w-full h-full object-cover" data-alt="professional headshot of a middle-aged male account manager in a clean corporate setting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBX7ORj7t5kRHgQhrKRm2tLnIck9E6SbX6yK6xk28q9qJkDDUUhJhb3Bwv_WnM6CPbkwCHvx9y9ovI8nZ15obldx_W5gLNVZDp5cp0mTmVMoyTMUZddnZRlUx56FkF2bKGizrG4BdNh75KODlx1uj2PUvqurSinM7L3E_b9E8GGHjsnAaTyA2H-E865r637qkyn14nBp4neSmubOTReOwPmHJqtDakwyADa8neZXBOjagniDYaN5qTtP4MKVsFW2R7tXR42kDOo1pfY"/>
</div>
<div>
<p class="text-[10px] text-on-surface-variant font-medium">Assigned To</p>
<p class="text-xs font-bold text-on-surface">Alex Thompson (You)</p>
</div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 pb-safe h-16 bg-[#f4faff]/80 dark:bg-slate-950/80 backdrop-blur-xl border-t border-slate-200/15 shadow-[0_-4px_24px_rgba(0,31,42,0.06)]">
<a class="flex flex-col items-center justify-center text-slate-500 dark:text-slate-400 px-3 py-1 hover:text-[#b22222] active:opacity-80 transition-all" href="#">
<span class="material-symbols-outlined">dashboard</span>
<span class="font-['Inter'] text-[10px] font-medium">Dashboard</span>
</a>
<a class="flex flex-col items-center justify-center bg-[#c9e7f7] dark:bg-slate-800 text-[#8f000d] dark:text-red-300 rounded-lg px-3 py-1 active:opacity-80 transition-all" href="#">
<span class="material-symbols-outlined">event_note</span>
<span class="font-['Inter'] text-[10px] font-medium">Activities</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-500 dark:text-slate-400 px-3 py-1 hover:text-[#b22222] active:opacity-80 transition-all" href="#">
<span class="material-symbols-outlined">group</span>
<span class="font-['Inter'] text-[10px] font-medium">Leads</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-500 dark:text-slate-400 px-3 py-1 hover:text-[#b22222] active:opacity-80 transition-all" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="font-['Inter'] text-[10px] font-medium">Settings</span>
</a>
</nav>
</body></html>
