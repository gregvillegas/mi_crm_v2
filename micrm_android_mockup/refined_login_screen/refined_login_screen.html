<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .active-input-border {
            position: relative;
        }
        .active-input-border::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background-color: #b22222;
            transition: width 0.3s ease;
        }
        .active-input-border:focus-within::after {
            width: 100%;
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>

<body class="bg-surface font-body text-on-surface min-h-screen flex flex-col">
<!-- Hero Background Section (Asymmetric Layout) -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute -top-24 -right-24 w-96 h-96 bg-surface-container-high rounded-full opacity-50 blur-3xl"></div>
<div class="absolute top-1/2 -left-48 w-80 h-80 bg-surface-container rounded-full opacity-30 blur-3xl"></div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 flex-1 flex flex-col items-center justify-center px-6 py-8 md:py-24">
<!-- Logo Header -->
<div class="mb-10 text-center">
<div class="flex items-center justify-center gap-3 mb-4">
<div class="w-14 h-14 bg-primary flex items-center justify-center rounded-2xl shadow-xl shadow-primary/20">
<span class="material-symbols-outlined text-on-primary text-3xl" style="font-variation-settings: 'FILL' 1;">dataset</span>
</div>
<h1 class="font-headline font-extrabold italic text-4xl tracking-tighter text-primary">MiCRM</h1>
</div>
<p class="font-headline font-bold text-xl text-on-surface tracking-tight">Precision Enterprise Architecture</p>
<p class="text-on-surface-variant/70 text-xs mt-2 uppercase tracking-[0.2em] font-semibold">Authorized personnel only</p>
</div>
<!-- Login Card -->
<div class="w-full max-w-md">
<div class="bg-surface-container-lowest p-8 md:p-10 rounded-2xl shadow-[0_20px_40px_-12px_rgba(0,31,42,0.12)] border border-white/40">
<form class="space-y-6">
<!-- Username Field -->
<div class="space-y-2">
<label class="font-label font-bold text-[10px] uppercase tracking-[0.15em] text-on-surface-variant/80 ml-1" for="username">Username</label>
<div class="relative active-input-border bg-surface-container-high/60 rounded-t-lg transition-all duration-200">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-xl">person</span>
</div>
<input class="block w-full pl-12 pr-4 py-[14px] bg-transparent border-none focus:ring-0 text-on-surface font-medium placeholder:text-on-surface-variant/40" id="username" name="username" placeholder="Enter your ID" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="font-label font-bold text-[10px] uppercase tracking-[0.15em] text-on-surface-variant/80 ml-1" for="password">Password</label>
<div class="relative active-input-border bg-surface-container-high/60 rounded-t-lg transition-all duration-200">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-xl">lock</span>
</div>
<input class="block w-full pl-12 pr-12 py-[14px] bg-transparent border-none focus:ring-0 text-on-surface font-medium placeholder:text-on-surface-variant/40" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-on-surface-variant/60 hover:text-primary transition-colors min-w-[44px] justify-center" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<!-- Remember & Action -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center space-x-3 cursor-pointer group min-h-[44px]">
<input class="w-5 h-5 rounded-md border-outline-variant text-primary focus:ring-primary focus:ring-offset-surface" type="checkbox"/>
<span class="text-sm font-semibold text-on-surface-variant/80 group-hover:text-on-surface transition-colors">Keep me signed in</span>
</label>
</div>
<!-- Primary Login Button -->
<button class="w-full bg-primary text-on-primary font-headline font-extrabold py-4 rounded-xl shadow-lg shadow-primary/30 hover:bg-[#8B0000] active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 min-h-[56px]" type="submit">
<span class="tracking-wide">SECURE LOGIN</span>
<span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</form>
<!-- Tertiary Action -->
<div class="mt-8 text-center">
<a class="inline-flex items-center gap-2 text-sm font-bold text-on-surface-variant/70 hover:text-primary transition-colors min-h-[44px] px-4" href="#">
<span class="material-symbols-outlined text-lg">help_outline</span>
<span>Having trouble? Contact support</span>
</a>
</div>
</div>
<!-- SSO/Alternate Options (Bento Style Suggestion) -->
<div class="mt-6 grid grid-cols-2 gap-4">
<button class="bg-surface-container-low/80 p-4 rounded-xl flex flex-col items-center justify-center gap-2 group hover:bg-surface-container-highest transition-colors min-h-[80px]">
<span class="material-symbols-outlined text-on-surface-variant/60 group-hover:text-primary transition-colors">passkey</span>
<span class="text-[10px] uppercase font-bold tracking-[0.15em] text-on-surface-variant/60">Passkey</span>
</button>
<button class="bg-surface-container-low/80 p-4 rounded-xl flex flex-col items-center justify-center gap-2 group hover:bg-surface-container-highest transition-colors min-h-[80px]">
<span class="material-symbols-outlined text-on-surface-variant/60 group-hover:text-primary transition-colors">domain</span>
<span class="text-[10px] uppercase font-bold tracking-[0.15em] text-on-surface-variant/60">SSO Login</span>
</button>
</div>
</div>
<!-- System Status Footer -->
<div class="mt-12 flex flex-col items-center gap-4 text-on-surface-variant/40">
<div class="flex items-center gap-2">
<div class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></div>
<span class="text-[10px] font-bold uppercase tracking-[0.2em]">Global Servers Online</span>
</div>
<div class="text-[10px] font-bold uppercase tracking-[0.2em]">v2.4.0-Stable Build</div>
</div>
</main>
<!-- Decorative Image Block -->
<div class="hidden lg:block fixed top-1/2 right-12 -translate-y-1/2 w-72 h-[480px] rounded-2xl overflow-hidden shadow-2xl rotate-2">

<div class="absolute inset-0 bg-gradient-to-t from-primary/10 to-transparent"></div>
</div>
</body></html>
