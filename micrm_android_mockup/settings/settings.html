<!DOCTYPE html>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(244, 250, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background font-body text-on-surface antialiased">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-6 py-4 w-full h-16 bg-[#f4faff] dark:bg-slate-950">
<div class="flex items-center gap-4">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-[#c9e7f7]/50 transition-colors duration-200">
<span class="material-symbols-outlined text-[#b22222]" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline font-bold text-xl text-[#b22222] tracking-tighter">Settings</h1>
</div>
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-[#c9e7f7]/50 transition-colors duration-200">
<span class="material-symbols-outlined text-[#b22222]" data-icon="more_vert">more_vert</span>
</button>
</header>
<main class="pt-20 pb-28 px-4 max-w-md mx-auto space-y-6">
<!-- User Profile Section -->
<section class="bg-surface-container-low p-5 rounded-xl flex items-center gap-5">
<div class="relative">
<img alt="Alex Thompson" class="w-20 h-20 rounded-full object-cover border-2 border-primary shadow-sm" data-alt="Close-up professional headshot of a smiling businessman in a navy suit, clean studio lighting, corporate style" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDSXxyGuKDpiPzYowHsBJsAOhd0_qjijRjrhTzIep84-lMiiWH-zQGbDe0276kLgk1CAZJqPUDkGOEubK-Ffrzy64Ai9lP9Rfqc2NIkVo0EF5nk5H2mGYbQxJFJJh90fSWnD1secV0ehUTEUJgr18T1XXSFw7CsgIHVqLlszX6o-liQ8B9-vHK5-2CAvX2AOR5z1lMMGr0g60fEKQQGS7RITIJcond_HT9dIUTZrnaiiyx-P-s46F88tjww4u-5KkLXb3aJD6M8fYWW"/>
<div class="absolute bottom-0 right-0 bg-primary w-6 h-6 rounded-full flex items-center justify-center border-2 border-surface">
<span class="material-symbols-outlined text-on-primary text-[14px]" data-icon="edit">edit</span>
</div>
</div>
<div class="flex-1">
<h2 class="font-headline font-bold text-lg text-on-surface leading-tight">Alex Thompson</h2>
<p class="text-on-surface-variant font-medium text-sm">Sales Executive</p>
<p class="text-on-surface-variant text-xs opacity-75">alex.thompson@micrm.io</p>
</div>
</section>
<!-- Notification Section -->
<div class="space-y-3">
<h3 class="font-headline font-bold text-sm uppercase tracking-widest text-on-surface-variant px-2">Notifications</h3>
<div class="bg-surface-container rounded-xl overflow-hidden">
<!-- Toggle Item -->
<div class="flex items-center justify-between p-4 bg-surface-container-lowest">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-lg bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[20px]" data-icon="verified">verified</span>
</div>
<span class="font-medium text-on-surface">New Approvals</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-surface-container-high peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
<!-- Toggle Item -->
<div class="flex items-center justify-between p-4 bg-surface-container-lowest mt-[2px]">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-lg bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[20px]" data-icon="notifications_active">notifications_active</span>
</div>
<span class="font-medium text-on-surface">Activity Reminders</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-surface-container-high peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
</div>
</div>
<!-- Account Section -->
<div class="space-y-3">
<h3 class="font-headline font-bold text-sm uppercase tracking-widest text-on-surface-variant px-2">Account</h3>
<div class="bg-surface-container-lowest rounded-xl overflow-hidden shadow-sm">
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-high transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary-container" data-icon="lock_reset">lock_reset</span>
<span class="font-medium text-on-surface">Change Password</span>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</button>
<button class="w-full flex items-center justify-between p-4 border-t border-surface-container hover:bg-surface-container-high transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary-container" data-icon="security">security</span>
<span class="font-medium text-on-surface">Security Settings</span>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</div>
<!-- App Info Section -->
<div class="space-y-3">
<h3 class="font-headline font-bold text-sm uppercase tracking-widest text-on-surface-variant px-2">App Info</h3>
<div class="bg-surface-container-lowest rounded-xl overflow-hidden shadow-sm">
<div class="flex items-center justify-between p-4">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="info">info</span>
<span class="font-medium text-on-surface">Version</span>
</div>
<span class="text-sm font-semibold text-primary">2.4.0</span>
</div>
<button class="w-full flex items-center justify-between p-4 border-t border-surface-container hover:bg-surface-container-high transition-colors">
<span class="font-medium text-on-surface pl-9">Privacy Policy</span>
<span class="material-symbols-outlined text-outline" data-icon="open_in_new">open_in_new</span>
</button>
<button class="w-full flex items-center justify-between p-4 border-t border-surface-container hover:bg-surface-container-high transition-colors">
<span class="font-medium text-on-surface pl-9">Terms of Service</span>
<span class="material-symbols-outlined text-outline" data-icon="open_in_new">open_in_new</span>
</button>
</div>
</div>
<!-- Logout Action -->
<div class="pt-4">
<button class="w-full py-4 rounded-xl font-headline font-bold text-on-primary bg-gradient-to-br from-primary to-primary-container shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="logout">logout</span>
                Logout
            </button>
</div>

<span class="material-symbols-outlined" data-icon="person_search">person_search</span>
<span class="font-inter font-medium text-[11px]">Leads</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-500 dark:text-slate-400 hover:text-[#b22222] transition-all active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="assignment">assignment</span>
<span class="font-inter font-medium text-[11px]">Tasks</span>
</div>
<div class="flex flex-col items-center justify-center bg-[#c9e7f7] dark:bg-slate-800 text-[#8f000d] dark:text-red-400 rounded-xl px-3 py-1 active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-inter font-medium text-[11px]">Settings</span>
</div>
</nav>
</body></html>
