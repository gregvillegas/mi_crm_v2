{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="fas fa-flask me-2"></i> {{ title }}</h4>
                </div>
                <div class="card-body">
                    {% if customer %}
                    <div class="alert alert-info mb-4">
                        <i class="fas fa-building me-2"></i> Creating POC for <strong>{{ customer.company_name }}</strong>
                    </div>
                    {% endif %}
                    
                    {% crispy form %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
