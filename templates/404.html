<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found · Django</title>
  <!-- Google Font & Font Awesome for clean typography & icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ----- reset & base ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(145deg, #f6f9fc 0%, #eef2f7 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      margin: 0;
      color: #1e293b;
    }

    /* ----- main card / container ----- */
    .error-container {
      max-width: 720px;
      width: 100%;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 48px;
      box-shadow: 0 30px 60px -20px rgba(0, 20, 40, 0.25),
                  0 8px 20px rgba(0, 0, 0, 0.02),
                  inset 0 1px 1px rgba(255, 255, 255, 0.6);
      padding: 3rem 2.5rem;
      transition: transform 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.5);
      text-align: center;
    }

    /* ----- error code & icon ----- */
    .error-icon {
      font-size: 4.5rem;
      color: #3b82f6;
      background: rgba(59, 130, 246, 0.08);
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 40px;
      margin: 0 auto 1.5rem;
      transition: 0.2s;
      box-shadow: 0 8px 16px -8px rgba(59, 130, 246, 0.2);
    }

    .error-icon i {
      filter: drop-shadow(0 4px 6px rgba(59, 130, 246, 0.15));
    }

    .error-code {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: #3b82f6;
      background: rgba(59, 130, 246, 0.08);
      display: inline-block;
      padding: 0.3rem 1.2rem;
      border-radius: 100px;
      margin-bottom: 0.75rem;
      border: 1px solid rgba(59, 130, 246, 0.1);
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin: 0.5rem 0 0.75rem;
      color: #0b1e33;
    }

    .lead {
      font-size: 1.2rem;
      font-weight: 400;
      color: #334155;
      margin-bottom: 1.75rem;
      line-height: 1.6;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, #3b82f6, #7c9cf5);
      border-radius: 10px;
      margin: 0.5rem auto 1.5rem;
    }

    /* ----- action buttons / links ----- */
    .action-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin: 2rem 0 0.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.8rem 2rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      transition: all 0.2s ease;
      border: 1px solid transparent;
      background: #ffffff;
      color: #1e293b;
      box-shadow: 0 4px 8px -4px rgba(0, 0, 0, 0.04);
      border-color: #e2e8f0;
      min-width: 160px;
      letter-spacing: 0.01em;
    }

    .btn-primary {
      background: #1e293b;
      color: white;
      border-color: #1e293b;
      box-shadow: 0 8px 16px -6px rgba(30, 41, 59, 0.2);
    }

    .btn-primary i {
      color: #94a3b8;
      transition: 0.2s;
    }

    .btn-primary:hover {
      background: #0f172a;
      transform: translateY(-2px);
      box-shadow: 0 14px 24px -10px rgba(15, 23, 42, 0.3);
      border-color: #0f172a;
    }

    .btn-primary:hover i {
      color: #e2e8f0;
    }

    .btn-outline {
      background: transparent;
      border-color: #d1d9e6;
      color: #1e293b;
    }

    .btn-outline i {
      color: #64748b;
    }

    .btn-outline:hover {
      background: #f1f5f9;
      border-color: #b0c1d4;
      transform: translateY(-2px);
      box-shadow: 0 8px 16px -8px rgba(0,0,0,0.06);
    }

    .btn-outline:hover i {
      color: #1e293b;
    }

    /* ----- subtle extra info / help text ----- */
    .help-text {
      margin-top: 2.5rem;
      font-size: 0.9rem;
      color: #64748b;
      border-top: 1px solid rgba(0,0,0,0.04);
      padding-top: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .help-text i {
      color: #94a3b8;
      font-size: 0.9rem;
    }

    .help-text a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px dotted rgba(37, 99, 235, 0.3);
      transition: 0.15s;
    }

    .help-text a:hover {
      color: #1d4ed8;
      border-bottom-color: #1d4ed8;
    }

    /* ----- dark / high contrast refinements ----- */
    @media (prefers-color-scheme: dark) {
      body {
        background: linear-gradient(145deg, #121a28, #1a2332);
      }
      .error-container {
        background: rgba(20, 30, 44, 0.8);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-color: rgba(255, 255, 255, 0.06);
        box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
      }
      .error-icon {
        background: rgba(59, 130, 246, 0.12);
        color: #60a5fa;
      }
      .error-code {
        background: rgba(59, 130, 246, 0.12);
        color: #60a5fa;
        border-color: rgba(59, 130, 246, 0.15);
      }
      h1 {
        color: #f1f5f9;
      }
      .lead {
        color: #cbd5e1;
      }
      .btn {
        background: #2a3a4e;
        border-color: #3a4b62;
        color: #e2e8f0;
      }
      .btn-primary {
        background: #3b82f6;
        border-color: #3b82f6;
        color: white;
        box-shadow: 0 8px 18px -6px rgba(59, 130, 246, 0.25);
      }
      .btn-primary:hover {
        background: #2563eb;
        border-color: #2563eb;
        box-shadow: 0 14px 24px -10px rgba(37, 99, 235, 0.4);
      }
      .btn-primary i {
        color: #bfdbfe;
      }
      .btn-outline {
        background: transparent;
        border-color: #3f536c;
        color: #d1d9e6;
      }
      .btn-outline:hover {
        background: #1f3143;
        border-color: #4d657f;
      }
      .btn-outline i {
        color: #94a3b8;
      }
      .help-text {
        color: #94a3b8;
        border-top-color: rgba(255,255,255,0.04);
      }
      .help-text a {
        color: #60a5fa;
        border-bottom-color: rgba(96, 165, 250, 0.3);
      }
      .help-text a:hover {
        color: #93bbfc;
      }
    }

    /* ----- responsive fine-tune ----- */
    @media (max-width: 500px) {
      .error-container {
        padding: 2rem 1.5rem;
        border-radius: 32px;
      }
      h1 {
        font-size: 2.2rem;
      }
      .error-icon {
        width: 80px;
        height: 80px;
        font-size: 3.5rem;
      }
      .lead {
        font-size: 1rem;
      }
      .action-group {
        flex-direction: column;
        align-items: stretch;
      }
      .btn {
        min-width: unset;
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="error-container" role="main" aria-labelledby="error-heading">
    <!-- 404 icon with subtle animation friendly -->
    <div class="error-icon" aria-hidden="true">
      <i class="fas fa-compass"></i>
    </div>

    <div class="error-code">
      <i class="fas fa-circle-exclamation" style="margin-right: 0.4rem;"></i> Error 404
    </div>

    <h1 id="error-heading">Page not found</h1>
    <div class="divider" aria-hidden="true"></div>
    <p class="lead">
      Sorry, we couldn’t find the page you’re looking for.  
      It might have been moved, deleted, or perhaps the URL contains a typo.
    </p>

    <!-- actions -->
    <div class="action-group">
      <a href="/" class="btn btn-primary">
        <i class="fas fa-arrow-left" aria-hidden="true"></i> Back to home
      </a>
      <a href="#" class="btn btn-outline" onclick="history.back(); return false;">
        <i class="fas fa-rotate-left" aria-hidden="true"></i> Go back
      </a>
    </div>

    <!-- additional help / search hint (django friendly) -->
    <div class="help-text">
      <i class="fas fa-life-ring" aria-hidden="true"></i>
      <span>Need help? </span>
      <a href="/admin/" title="Django admin (if available)">Admin</a>
      <span style="opacity:0.4; margin:0 0.2rem;">·</span>
      <a href="#" onclick="window.location.reload(); return false;">Refresh</a>
    </div>
  </div>

  <!-- small script: just for demo, no intrusive logic -->
  <script>
    (function() {
      // optional: log 404 event in console (for dev awareness)
      if (window.console && console.info) {
        console.info('🔍 404 – Page not found (Django error template)');
      }
      // make sure back button works with fallback
      const backBtn = document.querySelector('.btn-outline');
      if (backBtn) {
        backBtn.addEventListener('click', function(e) {
          if (history.length <= 1) {
            // if no history, redirect to home as fallback
            window.location.href = '/';
            e.preventDefault();
          }
        });
      }
    })();
  </script>
</body>
</html>
