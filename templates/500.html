{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error - CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body text-center py-5">
                        <i class="fas fa-exclamation-triangle text-warning fa-3x mb-3"></i>
                        <h3 class="mb-3">Something went wrong</h3>
                        <p class="text-muted mb-4">
                            The server encountered a temporary issue. This is usually caused by high traffic or a momentary system busy state.
                        </p>
                        <div class="d-flex justify-content-center gap-2">
                            <a href="javascript:location.reload()" class="btn btn-primary">
                                <i class="fas fa-redo me-1"></i> Try Again
                            </a>
                            <a href="/" class="btn btn-outline-secondary">
                                <i class="fas fa-home me-1"></i> Go to Home
                            </a>
                        </div>
                        <p class="text-muted small mt-4 mb-0">
                            If this keeps happening, please contact your system administrator.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
