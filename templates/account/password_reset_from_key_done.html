{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-lg">
            <div class="card-header bg-success text-white">
                <h3 class="card-title mb-0 text-center">
                    <i class="fas fa-circle-check me-2"></i>Password Changed
                </h3>
            </div>
            <div class="card-body text-center">
                <div class="mb-3">
                    <i class="fas fa-shield-halved fa-3x text-success"></i>
                </div>
                <p class="text-muted">
                    Your password has been updated successfully. You can now sign in with
                    your new password.
                </p>
                <div class="d-grid mt-4">
                    <a href="{% url 'account_login' %}" class="btn btn-primary btn-lg">
                        <i class="fas fa-sign-in-alt me-2"></i>Go to Login
                    </a>
                </div>
            </div>
            <div class="card-footer text-center text-muted">
                <small>Two-factor authentication is still required at login.</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
