{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-header">
        <h5 class="mb-0">Change Password</h5>
      </div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="id_old_password" class="form-label">Current Password</label>
            <input type="password" name="old_password" class="form-control" id="id_old_password" required>
          </div>
          <div class="mb-3">
            <label for="id_new_password1" class="form-label">New Password</label>
            <input type="password" name="new_password1" class="form-control" id="id_new_password1" required>
          </div>
          <div class="mb-3">
            <label for="id_new_password2" class="form-label">Confirm New Password</label>
            <input type="password" name="new_password2" class="form-control" id="id_new_password2" required>
          </div>
          <button type="submit" class="btn btn-primary">Update Password</button>
          <a href="{% url 'home' %}" class="btn btn-secondary ms-2">Cancel</a>
        </form>
        {% if form.errors %}
          <div class="alert alert-danger mt-3">
            Please correct the errors and try again.
          </div>
        {% endif %}
      </div>
    </div>
  </div>
  <div class="col-md-5">
    <div class="alert alert-info">
      <strong>Password requirements:</strong>
      <ul class="mb-0">
        <li>Use a mix of letters, numbers, and symbols</li>
        <li>Avoid common words or easily guessable info</li>
      </ul>
    </div>
  </div>
{% endblock %}
