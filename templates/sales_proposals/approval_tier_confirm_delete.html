{% extends 'base.html' %}
{% block content %}
<div class="container">
  <h3 class="mb-4">Delete Approval Tier?</h3>
  <p>Are you sure you want to delete the tier "{{ tier.name|default:'(unnamed)'}}"?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'approval_tier_list' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
