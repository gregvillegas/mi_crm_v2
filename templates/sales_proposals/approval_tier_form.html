{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>{{ title }}</h2>
    <a href="{% url 'approval_tier_list' %}" class="btn btn-outline-secondary">Back</a>
  </div>
  <div class="card">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'approval_tier_list' %}" class="btn btn-secondary">Cancel</a>
      </form>
    </div>
  </div>
  <div class="mt-3">
    <small class="text-muted">Chain values: supervisor, asm, avp_or_gm. Separate by commas in desired order.</small>
  </div>
</div>
{% endblock %}
