{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Import Approval Tiers</h2>
    <div>
      <a href="{% url 'approval_tier_template' %}" class="btn btn-outline-secondary me-2">Download Template</a>
      <a href="{% url 'approval_tier_list' %}" class="btn btn-secondary">Back</a>
    </div>
  </div>
  <div class="card">
    <div class="card-body">
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary">Import</button>
      </form>
    </div>
  </div>
  <div class="mt-3">
    <small class="text-muted">Columns: name, min_amount_php, max_amount_php, chain, order, active</small>
  </div>
</div>
{% endblock %}
