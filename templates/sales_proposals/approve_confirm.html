{% extends 'base.html' %}
{% block content %}
<div class="container">
  <h3 class="mb-4">Approve Proposal {{ proposal.proposal_number }}?</h3>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Comment (optional)</label>
      <textarea name="comment" class="form-control" rows="3"></textarea>
    </div>
    <button type="submit" class="btn btn-success">Approve</button>
    <a href="{% url 'proposal_detail' proposal.pk %}" class="btn btn-secondary">Cancel</a>
  </form>
  <div class="mt-3">
    <a href="{% url 'proposal_detail' proposal.pk %}">Back to proposal</a>
  </div>
  <div class="mt-2">
    <a href="{% url 'approvals_inbox' %}">Back to Approvals Inbox</a>
  </div>
{% endblock %}
